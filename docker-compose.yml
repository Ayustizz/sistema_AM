version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: bizadmin_db
    environment:
      POSTGRES_USER: bizadmin
      POSTGRES_PASSWORD: bizadmin123
      POSTGRES_DB: bizadmin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizadmin -d bizadmin"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizadmin_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bizadmin:bizadmin123@db:5432/bizadmin
      NEXTAUTH_SECRET: bizadmin-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
